# Render Blueprint: web API + Monday-morning weekly coach job.
# Shared env lives in one environment group both services inherit via fromGroup —
# Render Blueprints don't support bulk envVarKeys on fromService, and this also
# means each secret is entered only once at apply time.

envVarGroups:
  - name: horizon-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # LLM provider for the weekly coach. deepseek routes through DeepSeek's
      # Anthropic-compatible endpoint; switch to anthropic + ANTHROPIC_API_KEY for Claude.
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_P8
        sync: false
      - key: APNS_ENV
        value: development

# NOTE: horizon-weekly runs as a scheduled GitHub Actions workflow that POSTs
# to /internal/coach/run with header x-cron-secret, since Render Cron Jobs
# have no free tier (web services do). See .github/workflows/weekly-coach.yml

services:
  - type: web
    name: horizon-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter horizon-api build
    startCommand: node apps/horizon-api/dist/index.js
    healthCheckPath: /health
    envVars:
      - fromGroup: horizon-shared
